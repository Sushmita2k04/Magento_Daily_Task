<div style="font-family: Arial, Helvetica, sans-serif; max-width: 37.5rem; margin: 0 auto; padding: 2rem; background-color: #f7f7f7; color: #333333; line-height: 1.6;">

    <div style="background-color: #ffffff; padding: 2rem; border-radius: 0.5rem; border: 0.0625rem solid #e5e5e5;">

        <h2 style="margin: 0 0 1.5rem; color: #222222; font-size: 1.5rem; font-weight: 600;">
            Thank You for Your Enquiry
        </h2>

        <p style="margin: 0 0 1rem; font-size: 1rem;">
            Hello {{var customer_name}},
        </p>

        <p style="margin: 0 0 1.5rem; font-size: 1rem;">
            We have received your product enquiry.
        </p>

        <div style="margin: 0 0 1.5rem; padding: 1rem; background-color: #f8f8f8; border-radius: 0.375rem;">
            <p style="margin: 0 0 0.5rem; font-size: 0.9375rem;">
                <strong style="color: #222222;">Product SKU:</strong>
                {{var product_sku}}
            </p>

            <p style="margin: 0; font-size: 0.9375rem;">
                <strong style="color: #222222;">Quantity:</strong>
                {{var quantity}}
            </p>
        </div>

        <p style="margin: 0 0 1rem; font-size: 1rem;">
            Our team will contact you shortly.
        </p>

        <p style="margin: 0; font-size: 1rem;">
            Thank you.
        </p>

    </div>

</div>
